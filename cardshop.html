<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CARD SHOP — STARLIVE OFFICIAL</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><defs><radialGradient id='g' cx='50%25' cy='50%25' r='50%25'><stop offset='0%25' stop-color='%23FFF275'/><stop offset='60%25' stop-color='%23FFD700'/><stop offset='100%25' stop-color='%23FFA500'/></radialGradient></defs><path d='M12 0C12 6.627 6.627 12 0 12C6.627 12 12 17.373 12 24C12 17.373 17.373 12 24 12C17.373 12 12 6.627 12 0Z' fill='url(%23g)'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./cardshop.css" />
</head>
<body>
<div class="stage-bg"></div>
<header class="cs-header">
  <a href="./cardshop.html" class="marquee-brand" style="text-decoration:none"><span class="bulb"></span> STARLIVE OFFICIAL</a>
  <nav class="cs-nav">
    <button class="on" id="navShop" type="button">CARD SHOP</button>
    <button id="navOrders" type="button">คำสั่งซื้อของฉัน</button>
  </nav>
  <input id="searchInput" class="field-input cs-search" placeholder="ค้นหาสินค้า..." />
  <div class="cs-right">
    <div id="headerAuthArea"></div>
    <button id="cartBtn" class="cs-cart-btn" type="button" aria-label="ตะกร้าสินค้า"><svg class="cs-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg><span id="cartBadge" class="cs-badge" style="display:none">0</span></button>
  </div>
</header>

<main class="cs-shell">
  <section class="cs-hero">
    <h1 class="display home-hero-title">การ์ดที่คุณตามหา</h1>
    <p class="muted home-hero-sub">เลือกใบที่ใช่ แล้วเป็นเจ้าของได้ง่าย ๆ<br />เลือกสินค้า ใส่ตะกร้า ชำระเงิน แล้วรอรับการ์ดถึงบ้าน</p>
  </section>
  <div id="chips" class="cs-chips"></div>
  <section id="grid" class="cs-grid"></section>
  <p id="empty" class="muted" style="display:none;text-align:center;padding:60px 0">ไม่พบสินค้า</p>
</main>

<div id="layer" class="cs-layer"><div id="panel" class="cs-panel"></div></div>
<!-- Popup ตรวจสอบสลิป (เหมือนร้านไลฟ์) -->
<div id="verifyOverlay" class="modal-overlay" style="display:none;">
  <div class="admin-card modal-card" style="text-align:center;">

    <div id="verifyStepChecking">
      <div class="spinner"></div>
      <h2 class="display" style="font-size:16px; margin:18px 0 6px;">กำลังตรวจสอบสลิปชำระเงิน</h2>
      <p class="muted" style="font-size:13px; margin:0;">กรุณารอสักครู่ ไม่ต้องปิดหน้าต่างนี้</p>
    </div>

    <div id="verifyStepFailed" style="display:none;">
      <div class="verify-icon verify-icon-failed">✕</div>
      <h2 class="display" style="font-size:17px; margin:14px 0 8px;">ตรวจสอบไม่สำเร็จ</h2>
      <p class="muted" id="failReasonText" style="font-size:13.5px; margin:0 0 20px;"></p>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <button type="button" id="retrySlipBtn" class="btn-marquee" style="margin:0;">ลองแนบสลิปอีกครั้ง</button>
        <a id="lineOaLink" href="#" target="_blank" rel="noopener" class="icon-btn ghost" style="text-decoration:none;">ติดต่อแอดมินผ่าน LINE OA</a>
      </div>
    </div>

  </div>
</div>

<div id="toast" class="cs-toast"></div>
<script type="module" src="./js/cardshop.js"></script>
</body>
</html>
