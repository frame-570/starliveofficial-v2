<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ชมไลฟ์สด/รีรัน — Star Live Official</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><defs><radialGradient id='g' cx='50%25' cy='50%25' r='50%25'><stop offset='0%25' stop-color='%23FFF275'/><stop offset='60%25' stop-color='%23FFD700'/><stop offset='100%25' stop-color='%23FFA500'/></radialGradient></defs><path d='M12 0C12 6.627 6.627 12 0 12C6.627 12 12 17.373 12 24C12 17.373 17.373 12 24 12C17.373 12 12 6.627 12 0Z' fill='url(%23g)'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="stage-bg"></div>

<header id="topBar" class="top-bar" style="display:none;">
  <div class="marquee-brand small"><span class="bulb"></span> STAR LIVE OFFICIAL</div>
  <h2 class="display top-bar-title" id="liveTitle"></h2>
  <div class="top-bar-right">
    <span class="live-badge" id="statusBadge"><span class="live-dot"></span> LIVE</span>
  </div>
</header>

<div id="app" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">

  <!-- Code entry screen -->
  <div id="codeScreen" class="pass-card">
    <div style="text-align:center;">
      <a href="./index.html" class="marquee-brand" style="text-decoration:none; display:inline-flex;">
        <span class="bulb"></span> STAR LIVE OFFICIAL <span class="bulb"></span>
      </a>
      <h1 class="display" style="font-size:22px; font-weight:700; margin:14px 0 4px;">ห้องรับชมถ่ายทอดสดส่วนตัว</h1>
      <p class="muted" style="font-size:13.5px; margin:0;">กรอกรหัสเข้าชม 8 หลักที่ได้รับหลังชำระเงิน</p>
    </div>

    <div class="perforation"></div>

    <form id="codeForm" autocomplete="off">
      <input
        id="codeInput"
        class="code-input"
        maxlength="8"
        placeholder="STXXXXXX"
        autocapitalize="characters"
        autocomplete="off"
        spellcheck="false"
      />
      <p class="error-text" id="errorText"></p>
      <button type="submit" class="btn-marquee" id="submitBtn">เข้าสู่การถ่ายทอดสด</button>
    </form>

    <p class="muted" style="text-align:center; font-size:12.5px; margin:16px 0 0;">
      ยังไม่มีบัตร? <a href="./index.html" style="color:var(--amber);">เลือกงานที่ต้องการชม</a>
    </p>
  </div>

  <!-- Live/rerun player screen -->
  <div id="playerScreen" class="stage-enter" style="display:none; text-align:center; padding-top:56px;">
    
    <!-- แถบแท็บสลับวันจะสร้างด้วย JS ตรงนี้ -->
    <div id="dayTabContainer" class="day-tabs-wrapper"></div>

    <div class="player-frame">
      <div class="aspect">
        <iframe id="streamFrame" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

</div>

<script type="module" src="./js/watch.js"></script>
</body>
</html>
