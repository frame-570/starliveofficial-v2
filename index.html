<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Star Live Official</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><defs><radialGradient id='g' cx='50%' cy='50%' r='50%'><stop offset='0%' stop-color='%23FFF275'/><stop offset='60%' stop-color='%23FFD700'/><stop offset='100%' stop-color='%23FFA500'/></radialGradient></defs><path d='M12 0C12 6.627 6.627 12 0 12C6.627 12 12 17.373 12 24C12 17.373 17.373 12 24 12C17.373 12 12 6.627 12 0Z' fill='url(%23g)'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="stage-bg"></div>

<header id="topBar" class="top-bar" style="display:none;">
  <div class="marquee-brand small"><span class="bulb"></span> STAR LIVE OFFICIAL</div>
  <h2 class="display top-bar-title" id="liveTitle"></h2>
  <div class="top-bar-right">
    <span class="live-badge"><span class="live-dot"></span> LIVE</span>
  </div>
</header>

<div id="app" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">

  <!-- PIN entry screen -->
  <div id="pinScreen" class="pass-card">
    <div style="text-align:center;">
      <div class="marquee-brand">
        <span class="bulb"></span> STAR LIVE OFFICIAL <span class="bulb"></span>
      </div>
      <h1 class="display" style="font-size:22px; font-weight:700; margin:14px 0 4px;">ห้องรับชมถ่ายทอดสดส่วนตัว</h1>
      <p class="muted" style="font-size:13.5px; margin:0;">กรอกรหัส PIN 6 หลักที่ได้รับ เพื่อเข้าชมการถ่ายทอดสด</p>
    </div>

    <div class="perforation"></div>

    <form id="pinForm" autocomplete="off">
      <div class="pin-row" id="pinRow">
        <input class="pin-box" inputmode="numeric" maxlength="1" data-idx="0" />
        <input class="pin-box" inputmode="numeric" maxlength="1" data-idx="1" />
        <input class="pin-box" inputmode="numeric" maxlength="1" data-idx="2" />
        <input class="pin-box" inputmode="numeric" maxlength="1" data-idx="3" />
        <input class="pin-box" inputmode="numeric" maxlength="1" data-idx="4" />
        <input class="pin-box" inputmode="numeric" maxlength="1" data-idx="5" />
      </div>
      <p class="error-text" id="errorText"></p>
      <button type="submit" class="btn-marquee" id="submitBtn">เข้าสู่การถ่ายทอดสด</button>
    </form>
  </div>

  <!-- Live player screen (hidden until PIN verified) -->
  <div id="playerScreen" class="stage-enter" style="display:none; text-align:center; padding-top:56px;">
    <div class="player-frame">
      <div class="aspect">
        <iframe id="ytFrame" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
