<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เข้าสู่ระบบ — Star Live Official</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><defs><radialGradient id='g' cx='50%25' cy='50%25' r='50%25'><stop offset='0%25' stop-color='%23FFF275'/><stop offset='60%25' stop-color='%23FFD700'/><stop offset='100%25' stop-color='%23FFA500'/></radialGradient></defs><path d='M12 0C12 6.627 6.627 12 0 12C6.627 12 12 17.373 12 24C12 17.373 17.373 12 24 12C17.373 12 12 6.627 12 0Z' fill='url(%23g)'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="stage-bg"></div>

<div class="login-shell">

  <!-- ฝั่งแบรนด์: บนจอใหญ่อยู่ซ้าย, มือถืออยู่บน -->
  <div class="login-brand-panel">
    <div class="marquee-brand" style="font-size:16px;">
      <span class="bulb"></span> STAR LIVE OFFICIAL <span class="bulb"></span>
    </div>
    <h1 class="display login-brand-headline">คอนเสิร์ตที่คุณรัก<br />ดูสดได้จากทุกที่</h1>
    <p class="muted login-brand-sub">เข้าสู่ระบบเพื่อซื้อบัตร ดูไลฟ์สด และย้อนดูรีรันได้ตลอดช่วงเวลาที่กำหนด</p>
  </div>

  <!-- ฝั่งฟอร์ม: บนจอใหญ่อยู่ขวา, มือถืออยู่ล่าง -->
  <div class="login-form-panel">
    <div class="pass-card" style="width:min(380px, 100%);">

      <div id="loginMode">
        <h2 class="display" style="font-size:19px; margin:0 0 4px; text-align:center;">เข้าสู่ระบบ</h2>
        <p class="muted" style="font-size:13px; text-align:center; margin:0 0 22px;">ยินดีต้อนรับกลับมา</p>

        <button id="googleBtn" type="button" class="google-btn">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          ดำเนินการต่อด้วย Google
        </button>

        <div class="login-divider"><span>หรือ</span></div>

        <form id="signInForm" autocomplete="on">
          <div style="margin-bottom:12px;">
            <label class="field-label" for="signInEmail">อีเมล</label>
            <input id="signInEmail" class="field-input" type="email" required autocomplete="email" />
          </div>
          <div style="margin-bottom:6px;">
            <label class="field-label" for="signInPassword">รหัสผ่าน</label>
            <input id="signInPassword" class="field-input" type="password" required autocomplete="current-password" />
          </div>
          <p class="error-text" id="signInError"></p>
          <button type="submit" class="btn-marquee" id="signInBtn" style="margin-top:12px;">เข้าสู่ระบบ</button>
        </form>

        <p class="muted" style="text-align:center; font-size:13px; margin-top:18px;">
          ยังไม่มีบัญชี? <button type="button" id="goSignUp" class="link-btn">สมัครสมาชิก</button>
        </p>
      </div>

      <div id="signUpMode" style="display:none;">
        <h2 class="display" style="font-size:19px; margin:0 0 4px; text-align:center;">สมัครสมาชิก</h2>
        <p class="muted" style="font-size:13px; text-align:center; margin:0 0 22px;">สร้างบัญชีเพื่อเริ่มซื้อบัตร</p>

        <button id="googleBtnSignUp" type="button" class="google-btn">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          สมัครด้วย Google
        </button>

        <div class="login-divider"><span>หรือ</span></div>

        <form id="signUpForm" autocomplete="on">
          <div style="margin-bottom:12px;">
            <label class="field-label" for="signUpName">ชื่อที่แสดง</label>
            <input id="signUpName" class="field-input" type="text" required autocomplete="name" />
          </div>
          <div style="margin-bottom:12px;">
            <label class="field-label" for="signUpEmail">อีเมล</label>
            <input id="signUpEmail" class="field-input" type="email" required autocomplete="email" />
          </div>
          <div style="margin-bottom:6px;">
            <label class="field-label" for="signUpPassword">รหัสผ่าน (อย่างน้อย 8 ตัวอักษร)</label>
            <input id="signUpPassword" class="field-input" type="password" required minlength="8" autocomplete="new-password" />
          </div>
          <p class="error-text" id="signUpError"></p>
          <p class="muted" id="signUpNotice" style="text-align:center; font-size:13px; min-height:16px; margin:8px 0 0;"></p>
          <button type="submit" class="btn-marquee" id="signUpBtn" style="margin-top:12px;">สมัครสมาชิก</button>
        </form>

        <p class="muted" style="text-align:center; font-size:13px; margin-top:18px;">
          มีบัญชีอยู่แล้ว? <button type="button" id="goSignIn" class="link-btn">เข้าสู่ระบบ</button>
        </p>
      </div>

    </div>
  </div>
</div>

<script type="module" src="./js/login.js"></script>
</body>
</html>
